<title>SG Explorer · Random Singapore</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fbfaf6;--bg-soft:#f4f1e8;--surface:#fff;--surface-2:#f6f3ea;--border:rgba(60,45,20,.12);--border-strong:rgba(60,45,20,.24);--text-1:#2a2418;--text-2:#5a5140;--text-3:#8a7f68;--accent:#2d7d6e;--accent-2:#d88a3a;--accent-3:#c4593f;--radius:14px;--radius-lg:20px;--shadow:0 12px 30px rgba(60,45,20,.07);--shadow-lg:0 20px 48px rgba(60,45,20,.1)}
body{font-family:'Inter','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text-1);-webkit-font-smoothing:antialiased;padding:0 0 60px}
.header{padding:28px 40px 8px;max-width:1400px;margin:0 auto}
.header h1{font-family:'Playfair Display',serif;font-size:40px;font-weight:800;letter-spacing:-.02em;color:var(--text-1);line-height:1.05;display:inline}
.header .gen-time{font-family:'Inter',sans-serif;font-size:12px;font-weight:400;color:var(--text-3);margin-left:12px;letter-spacing:0}
.loc-chips{max-width:1400px;margin:0 auto;padding:6px 40px 2px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.loc-chips::-webkit-scrollbar{height:3px}
.loc-chips::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.loc-chip{display:inline-flex;flex-direction:column;padding:10px 20px 8px;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text-2);transition:all .2s ease;user-select:none;margin-right:8px;vertical-align:top;line-height:1.25}
.loc-chip:hover{border-color:var(--accent);color:var(--accent)}
.loc-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.loc-chip .loc-name{font-weight:700;font-size:15px}
.loc-chip .loc-street{font-weight:400;font-size:10px;opacity:.65;margin-top:1px}
.loc-chip .loc-coords{font-weight:400;font-size:9px;opacity:.5;margin-top:1px}
.loc-chip .loc-count{display:inline-block;margin-top:3px;padding:1px 8px;border-radius:8px;font-size:10px;font-weight:600;background:var(--bg-soft);color:var(--text-3);align-self:flex-start}
.loc-chip.active .loc-count{background:rgba(255,255,255,.2);color:#fff}
.cat-chips{max-width:1400px;margin:0 auto;overflow-x:auto;overflow-y:hidden;white-space:nowrap;padding:6px 40px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.cat-chips::-webkit-scrollbar{height:4px}
.cat-chips::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.chip{display:inline-block;padding:6px 15px;border-radius:999px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text-2);transition:all .2s ease;user-select:none;margin-right:5px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip .num{display:inline-block;margin-left:4px;padding:0 5px;border-radius:5px;font-size:10px;font-weight:600;background:var(--bg-soft);color:var(--text-3);transition:all .2s}
.chip.active .num{background:rgba(255,255,255,.2);color:#fff}
.cards-grid{padding:12px 40px;max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease;display:none}
.card.visible{display:block}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card .type-badge{display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-2);margin-bottom:5px}
.card h3{font-size:16px;font-weight:600;color:var(--text-1);margin-bottom:3px;line-height:1.3}
.card .address{font-size:12px;color:var(--text-3);margin-bottom:4px;line-height:1.4}
.card .distance{font-size:11px;color:var(--accent);font-weight:500;margin-bottom:5px}
.card .desc{font-size:13px;color:var(--text-2);line-height:1.5;margin-bottom:8px}
.card .rating{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-2);margin-bottom:7px}
.card .rating .star{color:#e8a020}
.card .rating .num-reviews{color:var(--text-3);font-size:11px}
.card .map-link{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:var(--radius);background:var(--accent);color:#fff;font-size:12px;font-weight:500;text-decoration:none;transition:background .2s}
.card .map-link:hover{background:var(--accent-2)}
.card .map-link svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty-state{display:none;text-align:center;padding:80px 20px;color:var(--text-3);grid-column:1/-1}
.empty-state.show{display:block}
.empty-state h3{font-family:'Playfair Display',serif;font-size:26px;color:var(--text-2);margin-bottom:6px}
.empty-state p{font-size:14px}
.other-type{display:inline-block;font-size:9px;color:var(--text-3);background:var(--bg-soft);padding:1px 6px;border-radius:5px;font-weight:500;margin-left:5px}
@media(max-width:720px){.header{padding:20px 16px 6px}.loc-chips,.cat-chips{padding:4px 16px 6px}.cards-grid{padding:8px 16px;grid-template-columns:1fr}.header h1{font-size:30px}.header .gen-time{display:block;margin-left:0;margin-top:2px}}
</style>
</head>

const CATEGORIES = {
  "Food":["restaurant","chinese_restaurant","western_restaurant","fusion_restaurant","indonesian_restaurant","fast_food_restaurant","asian_restaurant","asian_fusion_restaurant","seafood_restaurant","food_court","american_restaurant","italian_restaurant","japanese_restaurant","thai_restaurant","mexican_restaurant","indian_restaurant","korean_restaurant","vietnamese_restaurant","mediterranean_restaurant","steak_house","hot_pot_restaurant","ramen_restaurant","sushi_restaurant","halal_restaurant","hamburger_restaurant","pizza_restaurant","buffet_restaurant"],
  "Cafe/Bar":["cafe","bar","coffee_shop","coffee_roastery","coffee_stand","tea_house","juice_shop","cocktail_bar","pub","gastropub","brewery","brewpub","wine_bar","beer_garden","lounge_bar","hookah_bar","internet_cafe"],
  "Dessert":["dessert_restaurant","dessert_shop","ice_cream_shop","candy_store","chocolate_shop","cake_shop","donut_shop","pastry_shop","confectionery","frozen_yogurt_shop","bagel_shop"],
  "Shopping":["supermarket","convenience_store","book_store","electronics_store","store","department_store","clothing_store","drugstore","pharmacy","shopping_mall","grocery_store","furniture_store","home_goods_store","sporting_goods_store","jewelry_store","shoe_store","toy_store","florist","gift_shop","liquor_store","market"],
  "Fitness & Wellness":["gym","beauty_salon","spa","swimming_pool","fitness_center","yoga_studio","nail_salon","hair_salon","massage","massage_spa","tanning_studio","skin_care_clinic","wellness_center","sauna"],
  "Entertainment & Culture":["tourist_attraction","museum","night_club","movie_theater","amusement_center","scenic_spot","indoor_playground","art_gallery","amusement_park","bowling_alley","casino","comedy_club","cultural_center","karaoke","live_music_venue","performing_arts_theater","planetarium","stadium","zoo","aquarium","concert_hall","historical_landmark"],
  "Nature":["park","garden","camping_cabin","botanical_garden","beach","lake","hiking_area","national_park","nature_preserve","playground","river","dog_park","picnic_ground","water_park"]
};
const CAT_NAMES = Object.keys(CATEGORIES);
let currentSpot = 'a';

function getPlaces() {
  const a = [];
  for (const [t, ps] of Object.entries(SPOTS[currentSpot].groups))
    for (const p of ps) a.push({...p, _type: t});
  return a;
}

function catCount(ct) { return getPlaces().filter(p => ct.includes(p._type)).length; }
function tl(t) { return t.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()); }

// Location chips
const locChips = document.getElementById('locChips');
let first = true;
for (const [k, s] of Object.entries(SPOTS)) {
  const c = document.createElement('span');
  c.className = 'loc-chip' + (first ? ' active' : '');
  c.dataset.spot = k;
  const st = s.street.length > 20 ? s.street.slice(0, 20) + '...' : s.street;
  c.innerHTML = '<span class="loc-name">' + s.name + '</span><span class="loc-street">' + st + '</span><span class="loc-coords">' + s.lat.toFixed(4) + ', ' + s.lng.toFixed(4) + '</span><span class="loc-count">' + s.total + ' places</span>';
  locChips.appendChild(c);
  first = false;
}
setTimeout(function() {
  var chips = document.querySelectorAll('.loc-chip');
  var maxW = 0;
  chips.forEach(function(c) { c.style.minWidth = ''; maxW = Math.max(maxW, c.offsetWidth); });
  chips.forEach(function(c) { c.style.minWidth = maxW + 'px'; });
}, 0);

const catChips = document.getElementById('catChips');
const grid = document.getElementById('grid');

function buildChips() {
  catChips.innerHTML = '';
  const a = document.createElement('span');
  a.className = 'chip active'; a.textContent = 'All'; a.dataset.cat = '__all__';
  catChips.appendChild(a);
  for (const cn of CAT_NAMES) {
    const n = catCount(CATEGORIES[cn]);
    if (n === 0) continue;
    const c = document.createElement('span');
    c.className = 'chip'; c.dataset.cat = cn;
    c.innerHTML = cn + ' <span class="num">' + n + '</span>';
    catChips.appendChild(c);
  }
}

function renderCards() {
  grid.innerHTML = '';
  const active = new Set();
  document.querySelectorAll('#catChips .chip.active:not([data-cat="__all__"])').forEach(function(c) { active.add(c.dataset.cat); });
  const allMode = document.querySelector('#catChips [data-cat="__all__"]') ? document.querySelector('#catChips [data-cat="__all__"]').classList.contains('active') : true;
  const places = getPlaces();
  let shown = 0;
  for (const p of places) {
    if (!allMode && ![...active].some(function(c) { return (CATEGORIES[c]||[]).includes(p._type); })) continue;
    shown++;
    const card = document.createElement('div'); card.className = 'card visible';
    const dt = p.distance_m ? '<div class="distance">' + p.distance_m + 'm from centre</div>' : '';
    const dc = p.description ? '<div class="desc">' + p.description + '</div>' : '';
    var st = ''; for (var i=0;i<Math.max(1,Math.round(p.rating||0));i++) st += '&#9733;';
    var rt = p.rating ? '<div class="rating"><span class="star">' + st + '</span> ' + p.rating + ' <span class="num-reviews">(' + p.reviews.toLocaleString() + ')</span></div>' : '';
    const ic = CAT_NAMES.some(function(c) { return (CATEGORIES[c]||[]).includes(p._type); });
    const uc = ic ? '' : ' <span class="other-type">uncategorised</span>';
    card.innerHTML = '<div class="type-badge">' + tl(p._type) + uc + '</div><h3>' + p.name + '</h3><div class="address">' + p.address + '</div>' + dt + dc + rt + '<a class="map-link" href="' + p.mapsUrl + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="3"/><path d="M12 21C16 17 20 13.4183 20 10a8 8 0 1 0-16 0c0 3.4183 4 7 8 11z"/></svg> View on Maps</a>';
    grid.appendChild(card);
  }
  let em = document.querySelector('.empty-state');
  if (!em) { em = document.createElement('div'); em.className = 'empty-state'; em.innerHTML = '<h3>No matches</h3><p>Try a different category</p>'; grid.appendChild(em); }
  em.classList.toggle('show', shown === 0);
}

locChips.addEventListener('click', function(e) {
  var c = e.target.closest('.loc-chip');
  if (!c || c.classList.contains('active')) return;
  document.querySelectorAll('.loc-chip').forEach(function(x) { x.classList.remove('active'); });
  c.classList.add('active');
  currentSpot = c.dataset.spot;
  buildChips();
  renderCards();
});

catChips.addEventListener('click', function(e) {
  var c = e.target.closest('.chip');
  if (!c) return;
  if (c.dataset.cat === '__all__') {
    document.querySelectorAll('#catChips .chip').forEach(function(x) { x.classList.remove('active'); });
    c.classList.add('active');
  } else {
    var ae = document.querySelector('#catChips [data-cat="__all__"]');
    if (ae) ae.classList.remove('active');
    c.classList.toggle('active');
    if (!document.querySelector('#catChips .chip.active:not([data-cat="__all__"])') && ae) ae.classList.add('active');
  }
  renderCards();
});

buildChips();
renderCards();
</script>
