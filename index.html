<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fbfaf6;--bg-soft:#f4f1e8;--surface:#fff;--surface-2:#f6f3ea;
  --border:rgba(60,45,20,.12);--border-strong:rgba(60,45,20,.24);
  --text-1:#2a2418;--text-2:#5a5140;--text-3:#8a7f68;
  --accent:#2d7d6e;--accent-2:#d88a3a;--accent-3:#c4593f;
  --radius:14px;--radius-lg:20px;
  --shadow:0 12px 30px rgba(60,45,20,.07);
  --shadow-lg:0 20px 48px rgba(60,45,20,.1);
}
body{font-family:'Inter','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text-1);-webkit-font-smoothing:antialiased;padding:0 0 60px}
.header{padding:40px 48px 24px;max-width:1400px;margin:0 auto}
.header h1{font-family:'Playfair Display',serif;font-size:52px;font-weight:800;letter-spacing:-.02em;color:var(--text-1);line-height:1.05}
.header .sub{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-top:6px}
.header .meta{color:var(--text-2);font-size:15px;line-height:1.5}
.header .meta a{color:var(--accent);text-decoration:none;font-weight:500}
.header .meta a:hover{text-decoration:underline}
.header .count-badge{background:var(--accent);color:#fff;font-size:14px;font-weight:600;padding:6px 16px;border-radius:999px;white-space:nowrap}
.chips-row{padding:16px 48px 8px;max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-block;padding:8px 18px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text-2);transition:all .2s ease;user-select:none}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip .num{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;font-size:11px;font-weight:600;background:var(--bg-soft);color:var(--text-3);transition:all .2s}
.chip.active .num{background:rgba(255,255,255,.2);color:#fff}
.cards-grid{padding:24px 48px;max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease;display:none}
.card.visible{display:block}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card .type-badge{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-2);margin-bottom:8px}
.card h3{font-size:18px;font-weight:600;color:var(--text-1);margin-bottom:4px;line-height:1.3}
.card .address{font-size:13px;color:var(--text-3);margin-bottom:8px;line-height:1.4}
.card .desc{font-size:14px;color:var(--text-2);line-height:1.6;margin-bottom:12px}
.card .rating{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--text-2);margin-bottom:10px}
.card .rating .star{color:#e8a020}
.card .rating .num-reviews{color:var(--text-3);font-size:12px}
.card .map-link{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);background:var(--accent);color:#fff;font-size:13px;font-weight:500;text-decoration:none;transition:background .2s}
.card .map-link:hover{background:var(--accent-2)}
.card .map-link svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty-state{display:none;text-align:center;padding:80px 20px;color:var(--text-3);grid-column:1/-1}
.empty-state.show{display:block}
.empty-state h3{font-family:'Playfair Display',serif;font-size:28px;color:var(--text-2);margin-bottom:8px}
.empty-state p{font-size:15px}
@media(max-width:720px){
  .header{padding:28px 20px 16px}
  .chips-row{padding:12px 20px 4px}
  .cards-grid{padding:16px 20px;grid-template-columns:1fr}
  .header h1{font-size:36px}
}
</style>
</head>

// Flatten all places
let allPlaces = [];
const typeLabels = {};
for (const [type, places] of Object.entries(DATA.groups)) {
  typeLabels[type] = type.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  for (const p of places) {
    allPlaces.push({...p, _type: type});
  }
}

// Render chips
const chipsContainer = document.getElementById('chips');
let allChip = document.createElement('span');
allChip.className = 'chip active';
allChip.textContent = 'All';
allChip.dataset.type = '__all__';
chipsContainer.appendChild(allChip);

for (const [type, places] of Object.entries(DATA.groups)) {
  let chip = document.createElement('span');
  chip.className = 'chip';
  chip.dataset.type = type;
  let label = typeLabels[type];
  chip.innerHTML = `${label} <span class="num">${places.length}</span>`;
  chipsContainer.appendChild(chip);
}

// Render cards
const grid = document.getElementById('grid');
let activeTypes = new Set();

function render() {
  grid.innerHTML = '';
  let shown = 0;

  for (const p of allPlaces) {
    if (activeTypes.size > 0 && !activeTypes.has(p._type)) continue;
    shown++;

    let card = document.createElement('div');
    card.className = 'card visible';
    card.dataset.type = p._type;

    let stars = p.rating ? '★'.repeat(Math.round(p.rating)) : '';
    let ratingHtml = p.rating
      ? `<div class="rating"><span class="star">${'★'.repeat(Math.round(p.rating))}</span> ${p.rating} <span class="num-reviews">(${p.reviews.toLocaleString()} reviews)</span></div>`
      : '';

    card.innerHTML = `
      <div class="type-badge">${typeLabels[p._type] || p._type}</div>
      <h3>${p.name}</h3>
      <div class="address">${p.address}</div>
      ${p.description ? `<div class="desc">${p.description}</div>` : ''}
      ${ratingHtml}
      <a class="map-link" href="${p.mapsUrl}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="3"/><path d="M12 21C16 17 20 13.4183 20 10a8 8 0 1 0-16 0c0 3.4183 4 7 8 11z"/></svg>
        View on Maps
      </a>
    `;
    grid.appendChild(card);
  }

  // Empty state
  let empty = document.querySelector('.empty-state');
  if (!empty) {
    empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = '<h3>No matches</h3><p>Try selecting a different category</p>';
    grid.appendChild(empty);
  }
  empty.classList.toggle('show', shown === 0);
}

// Chip click handler
chipsContainer.addEventListener('click', e => {
  let chip = e.target.closest('.chip');
  if (!chip) return;

  let type = chip.dataset.type;

  if (type === '__all__') {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeTypes = new Set();
  } else {
    document.querySelector('[data-type="__all__"]').classList.remove('active');
    chip.classList.toggle('active');
    activeTypes = new Set();
    document.querySelectorAll('.chip.active:not([data-type="__all__"])').forEach(c => {
      activeTypes.add(c.dataset.type);
    });
    if (activeTypes.size === 0) {
      document.querySelector('[data-type="__all__"]').classList.add('active');
    }
  }
  render();
});

render();
</script>
